name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets needed: the only workflow that needs a token is the Pages deploy,
# and that is a separate workflow. This one just has to prove the build and the
# content checks pass.
permissions:
  contents: read

jobs:
  verify:
    # Self-hosted (CT103). GitHub-hosted runners do not work on this account:
    # the Actions minute budget blocks hosted jobs before they start, which
    # shows up as a ~0s failure with no steps executed.
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Content checks
        run: npm test

      - name: Build
        run: npm run build

      - name: Sanity-check the build output
        # Assert the LIBRARY component, not the project's former parallel
        # implementation. This grep named `link-row`, which the oem-ui
        # migration replaced with `cm-row`; it stayed green on the deploy
        # while failing here for two commits, because nothing in the deploy
        # path runs this job.
        run: |
          test -f dist/index.html
          grep -q 'class="cm-row"' dist/index.html
          grep -q 'class="cm-rows' dist/index.html
          # and the page must not have fallen back to the old local classes
          ! grep -q 'class="link-row"' dist/index.html

      # Assets are referenced with an absolute path built from `base`. A wrong
      # base still builds cleanly and then 404s every asset in production, so
      # assert this job's build matches the base it declares. This job uses the
      # config defaults; deploy.yml overrides SITE_BASE for the Pages fallback.
      - name: Assert the build matches the configured base
        run: |
          test -f dist/index.html
          grep -q "$BASE_PREFIX" dist/index.html
        env:
          BASE_PREFIX: href="/_astro/
