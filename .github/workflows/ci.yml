name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets needed and no deploy step: this repo is private and the site is
# self-hosted, so CI only has to prove the build and the content checks pass.
permissions:
  contents: read

jobs:
  verify:
    # Self-hosted (CT103). GitHub-hosted runners do not work on this account:
    # the Actions minute budget blocks hosted jobs before they start, which
    # shows up as a ~0s failure with no steps executed.
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Content checks
        run: npm test

      - name: Build
        run: npm run build

      - name: Sanity-check the build output
        run: test -f dist/index.html && grep -q 'class="link-row"' dist/index.html
