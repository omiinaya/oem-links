name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Failing the build on a bad icon/href keeps a broken page from ever
      # reaching production.
      - name: Content checks
        run: npm test

      - name: Build
        # The canonical custom domain (links.oem.ngo) is live and is served from
        # its own root, so no path prefix applies. The GitHub Pages fallback URL
        # (omiinaya.github.io/oem-links/) would instead need
        # SITE_BASE=/oem-links/; if this domain ever stops resolving, set both
        # values here as a pair rather than editing just one.
        run: npm run build

      - name: Assert the build serves from the domain root
        run: |
          grep -q 'href="/_astro/' dist/index.html
          ! grep -qE 'href="/oem-links/_astro/' dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # The build must finish before the deploy job is even created, so it does
    # not need its own runner slot.
    needs: build
    runs-on: [self-hosted, linux, x64, pve-scripts]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
