name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Failing the build on a bad icon/href keeps a broken page from ever
      # reaching production.
      - name: Content checks
        run: npm test

      - name: Build
        # Build for the GitHub Pages fallback URL. The canonical custom domain
        # (links.oem.ngo) needs base "/", but while that domain is not resolving
        # this fallback path is the only reachable URL, and it requires
        # base "/oem-links/". Flip SITE_BASE/SITE_URL together in
        # astro.config.mjs once the custom domain resolves.
        env:
          SITE_BASE: /oem-links/
          SITE_URL: https://omiinaya.github.io
        run: npm run build

      - name: Assert the build serves from the fallback path
        run: |
          grep -q 'href="/oem-links/_astro/' dist/index.html
          ! grep -qE 'href="/_astro/' dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # The build must finish before the deploy job is even created, so it does
    # not need its own runner slot.
    needs: build
    runs-on: [self-hosted, linux, x64, pve-scripts]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
