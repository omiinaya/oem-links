# Coolify-hosted sites reached THROUGH spacetime-rpm.
#
# WHY THIS FILE EXISTS
#
# rpm REWRITES the Host header on every forwarded request. From
# server/proxy/src/reverse_proxy.rs:
#
#     if is_hop_by_hop(&n) || n == "host" { continue; }   // drop the real Host
#     req = req.header("Host", &forward_ip);                // then set it to the UPSTREAM
#
# rpm ALSO preserves the original hostname, one line later:
#
#     let client_host = extract_hostname(headers);
#     if !client_host.is_empty() { req = req.header("X-Forwarded-Host", &client_host); }
#
# Coolify's generated label routers are `Host(`links.mrx.sh`)` /
# `Host(`<uuid>.71.196.102.69.sslip.io`)`, so they can never match a request that
# came through rpm, and Traefik answers with its own `404 page not found`
# (19 bytes - distinguishable from rpm's no-route `no such host`, 13 bytes).
#
# SO: match on X-Forwarded-Host, which rpm does forward verbatim. This is also
# what lets BOTH apps live behind the one Coolify Traefik: they share an
# upstream ip:port, so a Host-based rule (or a bare-ip Host rule, as used
# before) would send every request to whichever app sorted first.
#
# `forward_domain_name` on the rpm proxy host does NOT fix Host: the admin API
# accepts and stores the field, but rpm's forwarder only uses it to redirect
# non-canonical names - it never rewrites the outbound Host.
#
# REGENERATION: only `default_redirect_503.yaml` is marked "generated by
# Coolify, do not edit it manually". /data/coolify/proxy is bind-mounted to
# /traefik and Traefik runs with --providers.file.watch=true, so this file is
# live-reloaded and is not rewritten by an app redeploy. Re-check it after any
# Coolify upgrade that recreates the proxy container.
#
# NO TEMPLATE DELIMITERS: Traefik's file provider parses this YAML as a Go
# template. A literal brace-brace ANYWHERE in it - including inside a comment -
# is evaluated at load time, fails the whole file, and turns every route here
# into a 502 while Traefik can reach the service perfectly well.
http:
  routers:
    # oem/links -> https://links.mrx.sh/
    rpm-to-links:
      entryPoints:
        - http
      service: oem-links
      rule: Header(`X-Forwarded-Host`, `links.mrx.sh`)
      priority: 100

    # oem/log -> https://mrx-log.mrx.sh/
    rpm-to-log:
      entryPoints:
        - http
      service: oem-log
      rule: Header(`X-Forwarded-Host`, `mrx-log.mrx.sh`)
      priority: 100

  services:
    oem-links:
      loadBalancer:
        servers:
          # Container IPs on Coolify's shared `coolify` Docker network.
          # Traefik does NOT re-resolve Docker DNS after start, so the app
          # uuid alias resolves to nothing and returns 502 even though both
          # containers share the network - hence IP form.
          #
          # CONSEQUENCE: an IP is reassigned on every redeploy of that app.
          # If a site 502s with no rpm error, read the current IP (docker
          # inspect on the app container, format IPAddress), update it here,
          # then reload: docker exec coolify-proxy kill -1 1
          - url: http://10.0.1.6:80

    oem-log:
      loadBalancer:
        servers:
          # Same caveat as oem-links above: reassigned on redeploy.
          - url: http://10.0.1.10:80
