# oem/links, reached THROUGH spacetime-rpm.
#
# WHY THIS FILE EXISTS
#
# rpm rewrites the Host header on every forwarded request. Captured by
# pointing rpm at a controlled listener:
#
#     HEAD / HTTP/1.1
#     accept: */*
#     host: 192.168.1.104:80     <- the UPSTREAM ip:port, not links.mrx.sh
#
# So Coolify's generated label router, which is `Host(`links.mrx.sh`)`, can
# never match a request that arrived through rpm, and Traefik answers its own
# `404 page not found` (19 bytes - distinguishable from rpm's no-route
# `no such host`, 13 bytes). Plex and the other rpm backends are unaffected
# because they ignore the Host header; Traefik is the only one that routes on
# it.
#
# `forward_domain_name` on the rpm proxy host does NOT fix this: the admin API
# accepts and stores the field, but rpm's forwarder ignores it.
#
# So this router matches the Host rpm ACTUALLY sends - the upstream address -
# instead of the public hostname. That is safe because:
#   - it is scoped to one backend (the links container), and
#   - rpm is the only thing that ever sends a Host of bare-IP form here, and
#   - it does not collide with the generated Host(`links.mrx.sh`) router, so
#     a direct LAN request to links.mrx.sh still takes Coolify's own route.
#
# REGENERATION: only `default_redirect_503.yaml` is marked "generated by
# Coolify, do not edit it manually". /data/coolify/proxy is bind-mounted to
# /traefik and Traefik runs with --providers.file.watch=true, so this file is
# live-reloaded and is not rewritten by an app redeploy. Re-check it after any
# Coolify upgrade that recreates the proxy container.
http:
  routers:
    rpm-to-links:
      entryPoints:
        - http
      service: links
      # rpm replaces Host with the upstream address, so match that.
      # Priority 100 sits above Coolify's catchall (-1000).
      rule: Host(`192.168.1.104`) && PathPrefix(`/`)
      priority: 100

  services:
    links:
      loadBalancer:
        servers:
          # The container IP on Coolify's shared `coolify` Docker network.
          # Traefik does NOT re-resolve Docker DNS names after start, so the
          # alias form (lopjay2emcz3dkf3yzcjey1i) resolves to nothing even
          # though both containers share the network - it returns 502.
          #
          # CONSEQUENCE: this IP is reassigned when the app is redeployed.
          # If links.mrx.sh starts returning 502 with no rpm error, this is
          # the first thing to check - read the current IP with:
          #     docker inspect on the app container, format IPAddress
          # then update the url below and reload Traefik
          # (docker exec coolify-proxy kill -1 1).
          #
          # NOTE: Traefik's file provider treats this YAML as a Go template. If
          # you must document shell commands, do NOT wrap them in template
          # delimiters  , as that triggers a template evaluation error
          # during config reload and causes 502s for this router.
          - url: http://10.0.1.6:80
